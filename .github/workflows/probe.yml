name: FinMind 資料集測試(一次性)
on:
  push:
    branches: [claude/raw-prices]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ds in TaiwanStockPER TaiwanStockFinancialStatements TaiwanStockBalanceSheet TaiwanStockMonthRevenue; do
            curl -s -H "Authorization: Bearer ${{ secrets.FINMIND_TOKEN }}" "https://api.finmindtrade.com/api/v4/data?dataset=$ds&data_id=2330&start_date=2024-01-01&end_date=2024-12-31" \
              | python3 -c "import sys,json; j=json.load(sys.stdin); d=j.get('data',[]); print('::notice title=$ds::status=%s msg=%s rows=%d keys=%s sample=%s' % (j.get('status'), j.get('msg','')[:60], len(d), list(d[0].keys()) if d else '', str(d[:2])[:600]))"
          done
