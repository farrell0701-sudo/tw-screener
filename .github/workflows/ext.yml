name: 外部市場資料(融資/期貨/海外/匯率,研究用)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 11 * * 1-5"   # 台北 19:17，期貨法人資料公布後
  push:
    branches: [main]
    paths: [scripts/fetch_ext.py, .github/workflows/ext.yml]

permissions:
  contents: write

concurrency:
  group: ext
  cancel-in-progress: false

jobs:
  ext:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install pandas requests yfinance
      - name: 下載外部資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_ext.py
      - name: 存到分支 ext-data
        if: always()
        run: |
          cd out_ext
          git init -q -b ext-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "外部資料 $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ext-data
