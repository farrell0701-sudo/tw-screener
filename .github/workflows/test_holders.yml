name: 測試集保股權分散表 API(一次性)

on:
  push:
    branches: [claude/project-thread-baalym]
    paths: [scripts/test_holders_api.py, .github/workflows/test_holders.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/test_holders_api.py
