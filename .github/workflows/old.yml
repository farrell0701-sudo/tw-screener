name: 下載舊股價 2004~2016(含下市)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chips
  cancel-in-progress: false

jobs:
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install pandas requests
      - name: 取回之前已抓的部分
        run: |
          git clone -q --depth 1 -b old-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out_old || mkdir -p out_old
          rm -rf out_old/.git
      - name: 下載舊股價
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_old.py
      - name: 存到分支 old-data
        if: always()
        run: |
          cd out_old
          git init -q -b old-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "舊股價 $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" old-data
