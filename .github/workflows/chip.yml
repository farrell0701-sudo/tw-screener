      - name: 取回之前已抓的部分與下市股清單
        run: |
          git clone -q --depth 1 -b chip-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out_chip || mkdir -p out_chip
          rm -rf out_chip/.git
          git clone -q --depth 1 -b delist-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" delist_src || mkdir -p delist_src
      - name: 下載
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          STATUS_FILE: ${{ github.workspace }}/chip_status.txt
        run: python scripts/fetch_chip.py
      - name: 存到分支 chip-data
        if: always()
        run: |
          cd out_chip
          git init -q -b chip-data
          git config user.name "github-actions[bot]"
