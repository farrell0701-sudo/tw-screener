name: 下載歷史股價(回測用)

on:
  workflow_dispatch: {}      # 只在 Actions 頁面手動按「Run workflow」時執行

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 股票清單(沒有才抓)
        run: |
          if [ ! -f data/stock_list.csv ]; then python scripts/fetch_list.py; fi

      - name: 下載歷史日線並打包
        run: python scripts/fetch_history.py

      - name: 放到獨立分支 history-data(不影響網站)
        run: |
          cd out_history
          git init -q -b history-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "歷史日線 $(date -u +'%Y-%m-%d')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" history-data
