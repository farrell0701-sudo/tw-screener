name: 下載 2005–2014 本益比資料(回測用)

on:
  workflow_dispatch: {}      # 沒抓完就再按一次 Run workflow,會自動接續
  push:
    branches: [main]
    paths: [scripts/fetch_per_old.py, .github/workflows/per_old.yml]

permissions:
  contents: write

concurrency:
  group: chips               # 與其他 FinMind 下載共用額度,排隊執行
  cancel-in-progress: false

jobs:
  per_old:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install pandas requests
      - name: 取回之前已抓的部分
        run: |
          git clone -q --depth 1 -b per-old-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out_per_old || mkdir -p out_per_old
          rm -rf out_per_old/.git
      - name: 下載
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_per_old.py
      - name: 存到分支 per-old-data
        if: always()
        run: |
          cd out_per_old
          git init -q -b per-old-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "本益比 2005–2014 $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" per-old-data
